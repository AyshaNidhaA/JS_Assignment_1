<body>
<h1>🥭MANGO RUSH🥭</h1>

<div id="treebc"style="background-image: url(./images/tree1.png);background-size: contain;background-position: center;background-repeat: no-repeat;
background-color: #7596ba;min-height: 100vh;position: relative;">
    <div id="scorebox">
        <span id="scoretitle">🏆 SCORE</span>
        <span id="scoretext">Catch mangoes!</span>
    </div>

    <div id="lifebox">

        <span id="lifetitle">❤️ LIFE</span>
        <span>3 Continuous Misses</span>

    </div>

    <img id="mango1" src="./images/mango2.png"style=" width:36px; height:30px; position:absolute; top:225px; left:400px; ">

    height:30px; position:absolute; top:120px; left:500px; ">

 <img id="mango4" src="./images/mango3.png" style=" width:36px; height:30px; position:absolute; top:70px; left:700px; ">

    <audio id="catchsound" src="./Video Project.m4a"></audio>

    <button id="start">
        ▶ START GAME
    </button>

        Mangoes: 0
    </button>

        <div id="gameovertitle">
            GAME OVER
        </div>

        <div id="gameovertext">
            Try Again!
        </div>

        <button id="tryagain">
            🔄 TRY AGAIN
        </button>
    </div>
</div>



<script>

var basketx = 265
var baskety = 500

var basket = document.getElementById('basket')
var mango1x = 400
var mango1y = 225
var mango1 = document.getElementById('mango1')
var mango1done = false
var mango1miss = false
var mango2x = 500
var mango2y = 120
var mango2 = document.getElementById('mango2')
var mango2done = false
var mango2miss = false
var mango3x = 600
var mango3y = 185
var mango3 = document.getElementById('mango3')

var mango3miss = false

var mango4y = 70
var mango4 = document.getElementById('mango4')
var mango4done = false
var mango4miss = false
var mango5x = 800
var mango5y = 180
var mango5 = document.getElementById('mango5')
var mango5done = false
var mango5miss = false
var mark = 0
var continuousmiss = 0
var gameover = false
var round = 0
var started = false
var catchsound = document.getElementById('catchsound')
document.addEventListener('keydown', function(event){
    if(event.key == 'ArrowLeft'){
        basketx -= 50
        basket.style.left = basketx + 'px'
    }
    if(event.key == 'ArrowRight'){
        basketx += 50
        basket.style.left = basketx + 'px'
    }
})

document.getElementById('start').addEventListener('click', function(){
    if(started == true){
        return
    }
    started = true

    setInterval(function(){
        if(gameover == false){
   if(mango1done == false && mango1miss == false){
   mango1y += 30
    mango1.style.top = mango1y + 'px'
    if(mango1y >= baskety){
                    if(mango1x >= basketx &&    mango1x <= basketx + 106){
                        mark++
                        catchsound.play()
                        continuousmiss = 0
                        round++
                        if(round == 5){
                            round = 1
                        }
                        if(round == 1){
                            mango1x = 450
                            mango1y = 115
                        }
                        if(round == 2){
                            mango1x = 500
                            mango1y = 80
                        }
                        if(round == 3){
                            mango1x = 600
                            mango1y = 100
                        }
                        if(round == 4){
                            mango1x = 700
                            mango1y = 70
                        }
                        mango1.style.left = mango1x + 'px'
                        mango1.style.top = mango1y + 'px'
                    }
                    else{
                        continuousmiss++
                        mango1miss = true
                    }
                }
            }
            if(mango1miss == true){
                mango1y += 30
                mango1.style.top = mango1y + 'px'

                if(mango1y >= baskety + 100){
                    mango1x = 400
                    mango1y = 50
                    mango1.style.left = mango1x + 'px'
                    mango1.style.top = mango1y + 'px'
                    mango1miss = false

                }

            }

            if(mango2done == false && mango2miss == false){
              mango2y += 40
                mango2.style.top = mango2y + 'px'

                if(mango2y >= baskety){
                    if(mango2x >= basketx &&
                       mango2x <= basketx + 106){
                        mark++
                        catchsound.play()
                        continuousmiss = 0
                        round++
                        if(round == 5){
                            round = 1
                        }
                        if(round == 1){
                            mango2x = 550
                            mango2y = 70
                        }

                        if(round == 2){
                            mango2x = 600
                            mango2y = 140
                        }

                        if(round == 3){
                            mango2x = 750
                            mango2y = 90
                        }

                        if(round == 4){
                            mango2x = 450
                            mango2y = 130
                        }

                        mango2.style.left = mango2x + 'px'
                        mango2.style.top = mango2y + 'px'

                    }
                    else{
                        continuousmiss++
                        mango2miss = true

                    }

                }

            }

            if(mango2miss == true){
                mango2y += 40
                mango2.style.top = mango2y + 'px'

                if(mango2y >= baskety + 100){
                    mango2x = 500
                    mango2y = 50
                    mango2.style.left = mango2x + 'px'
                    mango2.style.top = mango2y + 'px'
                    mango2miss = false
                }
            }

            if(mango3done == false && mango3miss == false){
                mango3y += 20
                mango3.style.top = mango3y + 'px'

                if(mango3y >= baskety){
                    if(mango3x >= basketx &&
                       mango3x <= basketx + 106){
                        mark++
                        catchsound.play()
                        continuousmiss = 0
                        round++
                        if(round == 5){
                            round = 1
                        }

                        if(round == 1){
                            mango3x = 650
                            mango3y = 160
                        }

                        if(round == 2){
                            mango3x = 700
                            mango3y = 100
                        }

                        if(round == 3){
                            mango3x = 500
                            mango3y = 150
                        }

                        if(round == 4){
                            mango3x = 800
                            mango3y = 160
                        }

                        mango3.style.left = mango3x + 'px'
                        mango3.style.top = mango3y + 'px'

                    }
                    else{
                        continuousmiss++
                        mango3miss = true
                    }

                }

            }


        

            if(mango3miss == true){
                mango3y += 20
                mango3.style.top = mango3y + 'px'

                if(mango3y >= baskety + 100){
                    mango3x = 600
                    mango3y = 50
                    mango3.style.left = mango3x + 'px'
                    mango3.style.top = mango3y + 'px'
                    mango3miss = false
                }

            }

            if(mango4done == false && mango4miss == false){
                mango4y += 50
                mango4.style.top = mango4y + 'px'

                if(mango4y >= baskety){

                    if(mango4x >= basketx &&
                       mango4x <= basketx + 106){
                        mark++
                        catchsound.play()
                        continuousmiss = 0
                        round++
                        if(round == 5){
                            round = 1
                        }

                        if(round == 1){
                            mango4x = 750
                            mango4y = 130
                        }

                        if(round == 2){
                            mango4x = 800
                            mango4y = 170
                        }

                        if(round == 3){
                            mango4x = 650
                            mango4y = 190
                        }

                            mango4y = 90
                        }
                        mango4.style.left = mango4x + 'px'
                        mango4.style.top = mango4y + 'px'
                    }
                    else{
                        continuousmiss++
                        mango4miss = true
                    }

                }

            }

            if(mango4miss == true){
                mango4y += 50
                mango4.style.top = mango4y + 'px'

                if(mango4y >= baskety + 100){
                    mango4x = 700
                    mango4y = 50
                    mango4.style.left = mango4x + 'px'
                    mango4.style.top = mango4y + 'px'
                    mango4miss = false

                }

            }

            if(mango5done == false && mango5miss == false){
                mango5y += 35
                mango5.style.top = mango5y + 'px'
                if(mango5y >= baskety){
                    if(mango5x >= basketx &&
                       mango5x <= basketx + 106){
                        mark++
                        catchsound.play()
                        continuousmiss = 0
                        round++
                        if(round == 5){
                            round = 1
                        }

                        if(round == 1){
                            mango5x = 700
                            mango5y = 100
                        }

                        if(round == 2){
                            mango5x = 450
                            mango5y = 180
                        }

                        if(round == 3){
                            mango5x = 800
                            mango5y = 120
                        }

                            mango5x = 650
                            mango5y = 130
                        }

                        mango5.style.top = mango5y + 'px'

                    }

            if(mango5miss == true){
                mango5y += 35
                mango5.style.top = mango5y + 'px'
                if(mango5y >= baskety + 100){
                    mango5x = 800

                    mango5.style.top = mango5y + 'px'
                    mango5miss = false
                }

            }
            document.getElementById('mark').innerText =
            'Mangoes: ' + mark

            if(continuousmiss >= 3){
                document.getElementById('gameoverbox').style.display = 'block'
                gameover = true
            }

        }

    }, 500)

})

</script>
